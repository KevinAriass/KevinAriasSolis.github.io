
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StudyPath">
    <meta name="theme-color" content="#0f1a14">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>StudyPath - Learning Plan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-icon">📖</div>
            <h1 class="splash-title">StudyPath</h1>
            <p class="splash-subtitle">Your Learning Journey</p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">📖 StudyPath</h1>
                <p class="header-subtitle">Learning Plan</p>
            </div>
        </header>

        <!-- Progress Section -->
        <section class="progress-section">
            <div class="progress-card">
                <div class="progress-header">
                    <span class="progress-label">Overall Progress</span>
                    <span id="progressPercent" class="progress-percent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <div class="progress-stats">
                    <div class="stat">
                        <span id="completedCount" class="stat-number">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                    <div class="stat">
                        <span id="totalCount" class="stat-number">0</span>
                        <span class="stat-label">Total</span>
                    </div>
                    <div class="stat">
                        <span id="currentStreak" class="stat-number">0</span>
                        <span class="stat-label">Day Streak 🔥</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Phase Navigation -->
        <nav class="phase-nav">
            <div class="phase-nav-scroll">
                <button class="phase-tab active" data-phase="all">All</button>
                <button class="phase-tab" data-phase="0">Setup</button>
                <button class="phase-tab" data-phase="1">React</button>
                <button class="phase-tab" data-phase="2">Tailwind</button>
                <button class="phase-tab" data-phase="3">Next.js</button>
                <button class="phase-tab" data-phase="4">AI APIs</button>
                <button class="phase-tab" data-phase="5">DB & Auth</button>
                <button class="phase-tab" data-phase="6">Deploy</button>
            </div>
        </nav>

        <!-- Content -->
        <main id="content" class="content">
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="plan">
                <span class="nav-icon">📚</span>
                <span class="nav-label">Plan</span>
            </button>
            <button class="nav-btn" data-view="resources">
                <span class="nav-icon">🔗</span>
                <span class="nav-label">Resources</span>
            </button>
            <button class="nav-btn" data-view="stats">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Stats</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
