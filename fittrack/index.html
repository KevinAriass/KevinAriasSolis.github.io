
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f1a14">
    <title>FitTrack</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-icon">💪</div>
            <div class="splash-title">FitTrack</div>
            <div class="splash-subtitle">Daily Workout Tracker</div>
        </div>
    </div>

    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-icon">💪🔒</div>
                <div class="auth-title">FitTrack</div>
                <div class="auth-subtitle">Sign in to sync your progress</div>
            </div>
            <div class="auth-error hidden" id="authError"></div>
            <form class="auth-form" id="authForm">
                <div class="auth-input-group">
                    <label class="auth-label">EMAIL</label>
                    <input type="email" class="auth-input" id="authEmail" placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="auth-input-group">
                    <label class="auth-label">PASSWORD</label>
                    <input type="password" class="auth-input" id="authPassword" placeholder="Min. 6 characters" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary auth-btn">LOGIN</button>
                <button type="button" class="btn btn-secondary auth-btn" id="btnRegister">CREATE ACCOUNT</button>
            </form>
            <div class="auth-footer">Your data syncs across all devices</div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app hidden" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-title">FitTrack</div>
                <div class="header-right">
                    <span class="header-subtitle" id="todayDate"></span>
                    <button class="logout-btn" id="btnLogout">Logout</button>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="content" id="content"></main>

        <!-- Bottom Navigation - 5 tabs -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="today">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Today</span>
            </button>
            <button class="nav-btn" data-view="calendar">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Calendar</span>
            </button>
            <button class="nav-btn" data-view="wellness">
                <span class="nav-icon">🧠</span>
                <span class="nav-label">Wellness</span>
            </button>
            <button class="nav-btn" data-view="stats">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Stats</span>
            </button>
            <button class="nav-btn" data-view="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profile</span>
            </button>
        </nav>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
